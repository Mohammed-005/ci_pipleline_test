name: Docker compilation & validation pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-validate:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Compile the local image
        run: docker build -t graduation-app:latest .

      - name: Validate container runtime execution
        run: | 
          docker run --name active_test_runner graduation-app:latest
          echo "Container executed and exited cleanly with no runtime crashes."
